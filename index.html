<style>
:root{--bg:#fdfbf4;--grid:rgba(79,70,229,.07);--card:#fff;--tx:#1e1b3a;--mut:#6b6f8d;--pri:#5b4bff;--pri2:#eeebff;--bd:#e8e4f3;--acc:#fbbf24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--grid:rgba(255,255,255,.04);--card:#1e1b3d;--tx:#f1efff;--mut:#a9a6cf;--pri:#9b8cff;--pri2:#2b2760;--bd:#332f63}}
:root[data-theme="dark"]{--bg:#14122b;--grid:rgba(255,255,255,.04);--card:#1e1b3d;--tx:#f1efff;--mut:#a9a6cf;--pri:#9b8cff;--pri2:#2b2760;--bd:#332f63}

*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--tx);font:15px/1.45 Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-weight:500}
header{position:relative;overflow:hidden;padding:20px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:820px;width:calc(100% - 28px);margin:12px auto 6px;border-radius:26px;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#ec4899 100%);color:#fff;box-shadow:0 8px 0 rgba(79,70,229,.25)}
header>*{position:relative;z-index:1}
.sh{position:absolute;z-index:0;pointer-events:none}
.s1{width:90px;height:90px;border-radius:50%;background:#fbbf24;opacity:.9;right:-22px;top:-30px}
.s2{width:46px;height:46px;border:7px solid #38bdf8;border-radius:50%;right:70px;bottom:-16px;opacity:.9}
.s3{width:40px;height:40px;background:#34d399;clip-path:polygon(50% 0,100% 100%,0 100%);left:46%;top:-8px;opacity:.85;transform:rotate(18deg)}

h1{font-size:25px;font-weight:800;margin:0;letter-spacing:-.3px}h1 span{color:#fde68a}

nav{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;max-width:820px;margin:auto;scrollbar-width:none}
nav button{flex:none;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:99px;font:inherit;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--bd)}
nav button.on{color:#fff;border-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(-1px)}

.c{background:var(--card);border:2px solid var(--bd);border-top:7px solid var(--acc);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd)}

.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}

.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.b.g{background:var(--pri2);color:var(--pri);box-shadow:0 4px 0 var(--bd)}.b.d{background:none;color:#e11d48;padding:4px 8px;box-shadow:none;font-size:16px}
.b:disabled{opacity:.5}

.it:last-child{border:0}.m{color:var(--mut);font-size:13px}

</style></head><body>
<header><i class="sh s1"></i><i class="sh s2"></i><i class="sh s3"></i><i class="sh s4"></i><div><h1>🎓 Docentes <span>Pró</span></h1><div class="sub">✏️ Planeje, ensine e organize o seu dia</div></div><button class="cr" id="cr" onclick="sair()" style="border:0;font-family:inherit;cursor:pointer">Sair</button></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const TABS=[["hoje","🏠 Hoje"],["cal","📅 Calendário"],["plan","📝 Planos"],["proj","🚀 Projetos"],["bib","📚 Biblioteca"],["ia","✨ IA"],["cls","🏫 Turmas"]];
const ACC={hoje:"#fbbf24",cal:"#38bdf8",plan:"#f472b6",proj:"#14b8a6",bib:"#22c55e",ia:"#8b5cf6",cls:"#fb923c"};
const TC={aula:"#38bdf8",postagem:"#ec4899",prova:"#fb923c",reunião:"#14b8a6",projeto:"#8b5cf6",outro:"#94a3b8"};
const TIPOS=["aula","postagem","prova","reunião","projeto","outro"];
let S={ev:[],pl:[],pr:[],tu:[],bib:[],cr:100000,v:2},tab="hoje",now=new Date(),Y=now.getFullYear(),M=now.getMonth(),yr=false,sel="",ia={out:"",busy:false,err:""};
try{const r=localStorage.getItem("dp1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("dp1",JSON.stringify(S))}catch(e){}if(USER){clearTimeout(tm);tm=setTimeout(push,700)}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=iso(now);sel=today;
const uid=()=>Math.random().toString(36).slice(2,9);
const br=s=>s?s.split("-").reverse().join("/"):"";
const v=id=>document.getElementById(id).value.trim();
const MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const turmaOpts=(x)=>'<option value="">Turma (opcional)</option>'+S.tu.map(t=>`<option ${t===x?"selected":""}>${esc(t)}</option>`).join("");
const evHtml=e=>`<div class="it" style="border-left:6px solid ${TC[e.tipo]||'#94a3b8'};padding-left:10px"><div><span class="tag" style="background:${TC[e.tipo]||'#94a3b8'};color:#fff">${esc(e.tipo)}</span><b>${esc(e.title)}</b><div class="m">${br(e.date)}${e.hora?" · "+esc(e.hora):""}${e.turma?" · "+esc(e.turma):""}</div></div><div style="white-space:nowrap"><button class="b d" style="color:var(--pri)" onclick="editEv('${e.id}')">✎</button><button class="b d" onclick="del('ev','${e.id}')">✕</button></div></div>`;
function editEv(id){const e=S.ev.find(x=>x.id===id);editE=id;sel=e.date;tab="cal";R();scrollTo(0,document.body.scrollHeight)}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();R()}
function go(t){tab=t;R()}
function addEv(date,title,tipo,hora,turma){S.ev.push({id:uid(),date,title,tipo,hora,turma});}
function evForm(d){const e=S.ev.find(x=>x.id===editE)||{title:"",date:d,tipo:"aula",hora:"",turma:""};return `<div class="c"><h2>${editE?"Editar compromisso":"Novo compromisso"}</h2><input id="et" placeholder="Título" value="${esc(e.title)}"><div class="row"><input id="ed" type="date" value="${e.date}"><input id="eh" type="time" value="${e.hora||""}"></div><div class="row"><select id="ek">${TIPOS.map(t=>`<option ${t===e.tipo?"selected":""}>${t}</option>`).join("")}</select><select id="eu">${turmaOpts(e.turma)}</select></div><div class="row"><button class="b" onclick="saveEv()">${editE?"Salvar alterações":"Adicionar"}</button>${editE?'<button class="b g" onclick="editE=\'\';R()">Cancelar</button>':""}</div></div>`}
function saveEv(){const t=v("et"),d=v("ed");if(!t||!d)return;if(editE){Object.assign(S.ev.find(x=>x.id===editE),{title:t,date:d,tipo:v("ek"),hora:v("eh"),turma:v("eu")});editE=""}else addEv(d,t,v("ek"),v("eh"),v("eu"));save();sel=d;R()}
function vHoje(){const l=[...S.ev].filter(e=>e.date>=today).sort((a,b)=>(a.date+(a.hora||"")).localeCompare(b.date+(b.hora||""))).slice(0,8);
const t=S.ev.filter(e=>e.date===today);
return `<div class="c"><h2>Hoje, ${br(today)}</h2>${t.length?t.map(evHtml).join(""):'<div class="m">Nada marcado para hoje.</div>'}</div><div class="c"><h2>Próximos compromissos</h2>${l.length?l.map(evHtml).join(""):'<div class="m">Sem compromissos futuros.</div>'}</div>`+evForm(today)}
function vCal(){let h=`<div class="c"><div class="row" style="align-items:center"><button class="b g" onclick="nav2(-1)">‹</button><b style="text-align:center">${yr?Y:MES[M]+" "+Y}</b><button class="b g" onclick="nav2(1)">›</button></div><div class="row" style="margin-top:8px"><button class="b ${yr?"g":""}" onclick="yr=false;R()">Mês</button><button class="b ${yr?"":"g"}" onclick="yr=true;R()">Ano</button></div></div>`;
if(yr){h+='<div class="y">'+MES.map((n,m)=>{const c=S.ev.filter(e=>e.date.startsWith(Y+"-"+String(m+1).padStart(2,"0"))).length;return `<div class="c" onclick="M=${m};yr=false;R()"><b>${n}</b><div class="m">${c} compromisso${c==1?"":"s"}</div></div>`}).join("")+"</div>";return h}
const f=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate();
h+='<div class="c"><div class="g7 m">'+"DSTQQSS".split("").map(x=>`<div>${x}</div>`).join("")+"</div><div class='g7'>"+"<div></div>".repeat(f);
for(let d=1;d<=n;d++){const k=Y+"-"+String(M+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");const has=S.ev.some(e=>e.date===k);h+=`<button class="d ${k===today?"t":""} ${k===sel?"s":""}" onclick="sel='${k}';R()">${d}${has?"<i></i>":""}</button>`}
h+="</div></div>";const l=S.ev.filter(e=>e.date===sel);
return h+`<div class="c"><h2>${br(sel)}</h2>${l.length?l.map(evHtml).join(""):'<div class="m">Sem compromissos neste dia.</div>'}</div>`+evForm(sel)}
function nav2(d){if(yr){Y+=d}else{M+=d;if(M<0){M=11;Y--}if(M>11){M=0;Y++}}R()}
function snap(){const g=id=>document.getElementById(id);if(g("pt")){draft.t=g("pt").value;draft.d=g("pd").value;draft.u=g("pu").value;draft.c=g("pc").value}}
function vPlan(){const fl=draft.f.map((f,i)=>`<span class="at">📎 ${esc(f.name)} <a href="#" onclick="snap();draft.f.splice(${i},1);R();return false">✕</a></span>`).join("");
return `<div class="c"><h2>${editP?"Editar planejamento":"Novo planejamento"}</h2><input id="pt" placeholder="Título (ex.: Frações – 6º ano)" value="${esc(draft.t)}"><div class="row"><input id="pd" type="date" value="${draft.d}"><select id="pu">${turmaOpts(draft.u)}</select></div>${S.bib.some(x=>x.tipo==="modelo")?`<select onchange="aplicaMod(this.value)"><option value="">📚 Começar de um modelo da Biblioteca…</option>${S.bib.filter(x=>x.tipo==="modelo").map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join("")}</select>`:""}<textarea id="pc" placeholder="Objetivos, conteúdo, metodologia, avaliação...">${esc(draft.c)}</textarea>${AS?`<div class="m">📎 Anexos de até 20 MB cada (imagens, PDF, vídeo, texto, CSV):</div><input type="file" id="pf" multiple onchange="upAdd(this)">${fl}`:`<div class="m">📎 Anexar arquivos direto no app: em breve. Por enquanto, use os links do Google Drive abaixo.</div>`}<div class="m" style="margin-top:6px">🔗 Links para arquivos grandes (Google Drive, YouTube, sites):</div><div class="row"><input id="ln" placeholder="Nome (ex.: Livro de Ciências)"><input id="lu" placeholder="https://..."></div><button class="b g" onclick="addLk()">+ Adicionar link</button> ${draft.l.map((f,i)=>`<span class="at">🔗 ${esc(f.name)} <a href="#" onclick="snap();draft.l.splice(${i},1);R();return false">✕</a></span>`).join("")}<br><br>${fileErr?`<div class="er">${esc(fileErr)}</div>`:""}${editP?"":'<label class="m"><input type="checkbox" id="pa" checked style="width:auto;margin-right:6px">Agendar postagem no calendário</label><br><br>'}<div class="row"><button class="b" onclick="savePl()">${editP?"Salvar alterações":"Salvar"}</button>${editP?'<button class="b g" onclick="cancelPl()">Cancelar</button>':""}</div></div>`+
`<div class="c"><h2>Meus planejamentos</h2>${exportMsg?`<div class="m" style="color:var(--pri);margin-bottom:8px">${esc(exportMsg)}</div>`:""}${S.pl.length?[...S.pl].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class="it"><div><b>${esc(p.title)}</b><div class="m">${br(p.date)}${p.turma?" · "+esc(p.turma):""}</div>${(p.files||[]).map(f=>`<a class="at" href="${esc(f.url)}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a>`).join("")}${(p.links||[]).map(f=>`<a class="at" href="${esc(f.url)}" target="_blank" rel="noopener">🔗 ${esc(f.name)}</a>`).join("")}<details><summary class="m">Ver conteúdo</summary><pre>${esc(p.content)}</pre></details><div style="margin-top:6px"><button class="b g" onclick="pdf('${p.id}')">⬇ PDF</button> <button class="b g" onclick="word('${p.id}')">⬇ Word</button></div></div><div style="white-space:nowrap"><button class="b d" style="color:var(--pri)" onclick="editPl('${p.id}')">✎</button><button class="b d" onclick="del('pl','${p.id}')">✕</button></div></div>`).join(""):'<div class="m">Nenhum planejamento ainda.</div>'}</div>`}
async function upAdd(inp){snap();fileErr="";for(const f of inp.files){try{const r=await AS.upload(f);draft.f.push({id:r.id,name:f.name,url:r.url})}catch(e){fileErr="Não foi possível enviar "+f.name+". Tipos aceitos: imagens, PDF, vídeo, texto e CSV."}}R()}
function addLk(){snap();let u=document.getElementById("lu").value.trim(),n=document.getElementById("ln").value.trim();if(!u){fileErr="Cole o endereço do link no campo \"https://...\" e toque em Adicionar link.";return R()}fileErr="";if(!/^https?:\/\//i.test(u))u="https://"+u;draft.l.push({name:n||(function(){try{return new URL(u).hostname}catch(e){return u}})(),url:u});R()}
function editPl(id){const p=S.pl.find(x=>x.id===id);draft={t:p.title,d:p.date,u:p.turma,c:p.content,f:[...(p.files||[])],l:[...(p.links||[])]};editP=id;fileErr="";R();scrollTo(0,0)}
function cancelPl(){editP="";draft={t:"",d:today,u:"",c:"",f:[],l:[]};R()}
function savePl(){snap();const t=draft.t.trim();if(!t){fileErr="Escreva o título do planejamento (campo no topo do formulário) para poder salvar.";return R()}const d=draft.d||today;
if(editP){Object.assign(S.pl.find(x=>x.id===editP),{title:t,date:d,turma:draft.u,content:draft.c,files:draft.f,links:draft.l});editP=""}
else{S.pl.push({id:uid(),title:t,date:d,turma:draft.u,content:draft.c,files:draft.f,links:draft.l});if(document.getElementById("pa").checked)addEv(d,"Postar: "+t,"postagem","",draft.u)}
draft={t:"",d:today,u:"",c:"",f:[],l:[]};fileErr="";save();R()}
const clean=c=>(c||"").replace(/\*\*/g,"").replace(/^#+\s*/gm,"");
const slug=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").slice(0,40)||"planejamento";
async function dl(name,data){snap();try{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();a.remove();exportMsg="✔ "+name+" pronto! Veja na pasta Downloads do celular."}catch(e){exportMsg="Não foi possível baixar o arquivo."}R()}
const LT=t=>String(t).replace(/[–—]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/•/g,"*").replace(/…/g,"...").replace(/[^\x00-\xFF]/g,"?").replace(/[\\()]/g,m=>"\\"+m);
function wrapT(t,max){const out=[];String(t).split("\n").forEach(par=>{let ln="";par.split(" ").forEach(w=>{while(w.length>max){if(ln){out.push(ln);ln=""}out.push(w.slice(0,max));w=w.slice(max)}if((ln+" "+w).trim().length>max){out.push(ln);ln=w}else ln=(ln?ln+" ":"")+w});out.push(ln)});return out}
function pdfBlob(lines){const pages=[];let cur=[],y=800;
lines.forEach(l=>{const lead=l.sz*1.4;if(y-lead<56){pages.push(cur);cur=[];y=800}y-=lead;cur.push(`BT /F${l.b?2:1} ${l.sz} Tf 56 ${y.toFixed(1)} Td (${LT(l.t)}) Tj ET`)});pages.push(cur);
const N=5+pages.length*2,ob=[];ob[1]="<< /Type /Catalog /Pages 2 0 R >>";
ob[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>(6+2*i)+" 0 R").join(" ")}] /Count ${pages.length} >>`;
ob[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
ob[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
pages.forEach((pg,i)=>{const c=pg.join("\n");ob[5+2*i]=`<< /Length ${c.length} >>\nstream\n${c}\nendstream`;ob[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${5+2*i} 0 R >>`});
let out="%PDF-1.4\n";const off=[];for(let n=1;n<N;n++){off[n]=out.length;out+=`${n} 0 obj\n${ob[n]}\nendobj\n`}
const xr=out.length;out+=`xref\n0 ${N}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
return new Blob([Uint8Array.from(out,c=>c.charCodeAt(0))],{type:"application/pdf"})}
async function pdf(id){const p=S.pl.find(x=>x.id===id);exportMsg="";const L=[];
wrapT(p.title,50).forEach(t=>L.push({t,sz:16,b:1}));L.push({t:" ",sz:6});
L.push({t:br(p.date)+(p.turma?" - "+p.turma:""),sz:10});L.push({t:" ",sz:8});
wrapT(clean(p.content),88).forEach(t=>L.push({t:t||" ",sz:11}));
if((p.files||[]).length){L.push({t:" ",sz:8});wrapT("Anexos: "+p.files.map(f=>f.name).join(", "),95).forEach(t=>L.push({t,sz:10}))}
if((p.links||[]).length){L.push({t:" ",sz:8});wrapT("Links: "+p.links.map(f=>f.name+" ("+f.url+")").join("; "),95).forEach(t=>L.push({t,sz:10}))}
dl(slug(p.title)+".pdf",pdfBlob(L))}
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files){const te=new TextEncoder(),parts=[],cd=[];let off=0;
files.forEach(([name,txt])=>{const n=te.encode(name),d=te.encode(txt),c=crc32(d);
const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,33,true);lh.setUint32(14,c,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,n.length,true);lh.setUint16(28,0,true);
parts.push(new Uint8Array(lh.buffer),n,d);
const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,33,true);ch.setUint32(16,c,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
cd.push(new Uint8Array(ch.buffer),n);off+=30+n.length+d.length});
let cs=0;cd.forEach(x=>cs+=x.length);
const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})}
